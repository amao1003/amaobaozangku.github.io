<h1>获取公众号自动回复资源</h1>
<p class="sub">这一页是占位示例，内容由你自己填写。</p>

<div class="box">
  <p>原站右上角飘带指向的是一个「关键词自动回复」说明页。你可以在这里放：</p>
  <ul>
    <li>公众号关键词回复列表与对应资源</li>
    <li>加群 / 联系方式 / 二维码</li>
    <li>资源失效反馈入口</li>
    <li>任何你自己的说明内容</li>
  </ul>
  <p>改法：直接用记事本或 VS Code 编辑本文件；或在 <code>js/data.js</code> 里把 <code>meta.ribbon.url</code> 改成别的地址（比如你的公众号文章链接）。</p>
</div>
